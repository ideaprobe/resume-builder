services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
      POSTGRES_DB: resume_builder
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql

volumes:
  postgres_data:
